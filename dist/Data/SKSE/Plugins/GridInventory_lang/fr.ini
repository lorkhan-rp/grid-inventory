; Grid Inventory — traduction francaise (fork Lorkhan RP)
; Encodage UTF-8. Les cles sont les noms de FUI_LANG_STRINGS (plugin/src/ui/Lang.h) ;
; toute cle absente retombe sur l'anglais compile, donc ce fichier peut etre
; complete au fil des versions sans rien casser.
; Les %s / %d doivent rester identiques a l'anglais : le chargeur refuse (et
; journalise) toute ligne dont la signature de format differe.
#name = Français
#range = latin-ext
#order = 20

